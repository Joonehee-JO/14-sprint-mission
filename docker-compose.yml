services:
  backend:
    container_name: discodeit-backend
    build:
      context: .
    image: discodeit:local
    environment:
      SPRING_PROFILES_ACTIVE: prod    # 컨테이너 뜨는 시점에 prod
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - binary-content-data:/app/files
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: discodeit-postgres-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  binary-content-data:
  postgres-data:

